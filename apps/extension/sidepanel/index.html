<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starling</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="header">
      <img class="mark" src="../icons/icon48.png" alt="" width="22" height="22" />
      <div class="header-text">
        <h1>Starling</h1>
        <p class="page-title" id="page-title">No page</p>
      </div>
      <div class="combo" id="lang-combo" data-open="false">
        <button
          class="combo-button"
          id="lang-button"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          title="Your language"
        >
          <span class="label" id="lang-label">…</span>
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
        <div class="combo-menu" id="lang-menu" role="listbox" hidden></div>
      </div>
      <button class="icon-btn" id="new-chat" type="button" title="New chat">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
      <button class="status" id="status" type="button" title="Service status — click to re-check">
        <span class="dot" id="status-dot"></span>
      </button>
    </header>

    <main class="thread" id="thread">
      <div class="welcome" id="welcome">
        <img src="../icons/icon128.png" alt="" width="44" height="44" />
        <h2>Ask about this page, or tell me what to do on it</h2>
        <p>
          I read the page, answer questions, translate it into your language, and
          click through it for you. Everything runs on this machine.
        </p>
        <div class="suggestions" id="suggestions">
          <button type="button">Translate this page</button>
          <button type="button">What is this page about?</button>
          <button type="button">Find the contact details</button>
          <button type="button">Search this site for eligibility rules</button>
        </div>
      </div>
    </main>

    <p class="error" id="error" hidden></p>

    <div class="composer">
      <div class="composer-box">
        <textarea
          id="input"
          rows="1"
          placeholder="Ask anything, or say what to do…"
          enterkeyhint="send"
        ></textarea>
        <div class="composer-actions">
          <button class="icon-btn mic" id="mic-btn" type="button" title="Speak">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
              <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
              <path d="M12 19v3" />
            </svg>
          </button>
          <button class="send" id="send-btn" type="button" title="Send">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h13M12 5l7 7-7 7" />
            </svg>
          </button>
          <button class="stop-btn" id="stop-btn" type="button" title="Stop" hidden>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <rect x="6" y="6" width="12" height="12" rx="2" />
            </svg>
          </button>
        </div>
      </div>
      <div class="composer-foot">
        <span class="privacy" id="privacy">Local · 127.0.0.1:8000</span>
        <button class="link-btn" id="warm-btn" type="button">Warm models</button>
        <button class="link-btn" id="free-btn" type="button">Free memory</button>
        <button class="link-btn" id="cache-btn" type="button">Clear cache</button>
      </div>
    </div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
