[project]
name = "starling-asr"
version = "0.1.0"
description = "Starling speech pipeline: ASR + zero-shot voice-cloning TTS"
requires-python = ">=3.11,<3.12"

dependencies = [
    # --- API layer ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12", # multipart/form-data audio uploads
    # --- ASR (Apple Silicon native) ---
    "mlx-whisper>=0.4.3",
    # --- TTS (zero-shot voice cloning, 24 kHz out) ---
    "omnivoice>=0.2.1",
    # --- Debug UI. Also an omnivoice dep, pinned here because lab.py imports it directly. ---
    "gradio>=5",
    # --- Audio I/O ---
    "soundfile>=0.12",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starling"]
